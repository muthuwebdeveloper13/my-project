dataset:
  # path: "data/raw/Mall_Customers.csv"
  # path: "data/raw/customer_segmentation_data.csv"
  path: "data/raw/Test.csv"
  # path: "data/raw/Online-Retail.csv"  # module - 8 loading time is more so remove the module 8
  delimiter: ","
  encoding: "utf-8"

preprocessing:
  handle_missing: "mean"     # mean, median, mode, drop
  remove_outliers: false
  outlier_method: "iqr"      # iqr, zscore
  normalize: true
  method: "zscore"           # zscore, minmax
  plot_raw_data: true
  figure_size: [10, 6]

clustering:
  n_components: 3
  max_iterations: 50
  tolerance: 0.001
  random_state: 42
